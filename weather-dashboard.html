<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A weather dashboard showing current weather conditions and recent searches.">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather-dashboard.css">
    <script src="config.js"></script>
    <script src="weather-dashboard.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Weather Dashboard</h1>
        <p>Check the weather conditions in your city.</p>
    </header>

    <main>
        <section class="search-section" aria-labelledby="search-heading">
            <h2 id="search-heading">Find Your Weather</h2>

            <form id="weather-form">
                <label for="city-input">Enter city name</label>
                <input
                    type="search"
                    id="city-input"
                    placeholder="e.g. Nairobi"
                    required
                >
                <button type="submit">Search Weather</button>
            </form>
        </section>

        <section id="status-section" aria-live="polite">
            <p id="loading" class="hidden">Loading weather...</p>
            <p id="error-message" class="hidden"></p>
        </section>

        <section id="weather-section" aria-labelledby="weather-heading">
            <h2 id="weather-heading">Current Weather</h2>

            <article id="weather-card" class="weather-card">
                <p>Search for a city to see its weather.</p>
            </article>
        </section>

        <section aria-labelledby="recent-heading">
            <h2 id="recent-heading">Recent Searches</h2>
            <ul id="recent-searches">
                <li>No recent searches yet.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Weather Dashboard | Week 6 JavaScript Project</p>
    </footer>
</body>
</html>
