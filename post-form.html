<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Post</title>
    <link rel="stylesheet" href="post-form.css">
    <script src="post-form.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>Create a New Post</h1>
            <p>Submit your post using the JSONPlaceholder API.</p>
        </header>

        <form id="post-form">
            <label for="title">Post Title</label>
            <input type="text" id="title" required>

            <label for="body">Post Content</label>
            <textarea id="body" required></textarea>

            <label for="user-id">User ID</label>
            <input type="number" id="user-id" min="1" value="1" required>

            <button type="submit">Create Post</button>
        </form>

        <p id="loading" hidden>Submitting post...</p>
        <p id="error" role="alert"></p>

        <section id="result" aria-live="polite">
            <h2>Submitted Post</h2>
            <article id="post-display" hidden></article>
        </section>
    </main>
</body>
</html>
